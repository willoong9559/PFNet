DATA_CONFIG:
    DATASET_NAME: SemanticKitti
    DATASET_PATH: /run/media/song/1F6B8E85CBE1052C/dataset/sequencesbak
    DATASET_CONFIG: ./semantic-kitti.yaml
    DATALOADER:
        NUM_WORKER: 8

OPTIMIZE:
    LR: 0.0005
    MAX_EPOCH: 50
    EVAL_INTERVAL: 5

MODEL:
    NAME: PFNet
    NCLASS: 19
    LIMS: [[-48, 48], [-48, 48], [-3, 1.8]] # [[-84, 84], [-84, 84], [-36, 6]] #
    SIZES: [480, 480, 48] #  [840, 840, 420] #
    SCALES: [0.5, 1]
    GRID_METERS: [0.2, 0.2, 0.1]
    OFFSET: 0.5
    TARGET_SCALE: 1
    POOLING_SCALE: [0.5, 1, 2, 4, 6, 8, 12]
    SEM_PRETRAIN: null

    POLAR_INSTANCE:
        RADIAL_BINS: 480
        ANGULAR_BINS: 360
        MAX_RADIUS: 70.0
        PSEUDO_GRID_SIZE: 0.2
        PSEUDO_NMS_KERNEL: 5
        PSEUDO_CLASS_KERNEL: 5
        # SemanticKITTI 8 个 thing 类的默认合并半径（米），需按数据集调整。
        CENTER_GROUP_RADII: [2.0, 1.0, 1.0, 4.0, 4.0, 1.0, 1.0, 1.0]
        OFFSET_LOSS_WEIGHT: 1.0

    POST_PROCESSING:
        MERGE_FUNC: merge_ins_sem
